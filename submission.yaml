submission:
  title: "ShipTriage"

  problem_statement: >
    Supply chain disruptions such as weather events, port strikes, and other
    operational disruptions can affect many active shipments at the same time,
    making it difficult for logistics operations managers to quickly identify
    affected shipments, assess their priority, and choose suitable alternative
    routes.

  solution_summary: >
    ShipTriage is a logistics disruption decision-support application that helps
    operations managers analyze affected shipments, rank them by criticality,
    review rerouting options, and approve or override a recommended route while
    maintaining a decision log.

  key_features:
    - "Disruption input and affected shipment analysis"
    - "Shipment priority and criticality ranking"
    - "Shipment details with alternative rerouting options"
    - "Recommended rerouting option for manager review"
    - "Approve or override decisions with decision logging"

  tech_stack:
    languages:
      - "JavaScript"
    frameworks:
      - "React"
      - "Vite"
      - "Node.js"
      - "Express"
    ibm_technologies:
      - "IBM Bob"
    databases:
      - "SQLite"
    other:
      - "Git"
      - "GitHub"

  what_we_are_most_proud_of: >
    We are most proud of the end-to-end disruption decision workflow in ShipTriage,
    which connects the frontend with the backend to analyze disruptions, present
    shipment priorities and rerouting options, capture the manager's decision,
    and maintain a decision log.

  known_limitations: >
    The current MVP focuses on the core disruption-to-decision workflow. Advanced
    capabilities such as live external disruption feeds, real-time fleet
    optimisation, cold-chain IoT monitoring, and production deployment are not
    fully implemented in the current version.

  ibm_bob_usage: >
    IBM Bob was used as a development partner across three phases. In phase one,
    Bob reviewed the full codebase and produced a prioritized list of 14 findings
    covering bugs, logic errors, and demo risks — including a disconnected frontend
    (api.js functions written but never called in App.jsx), a hardcoded LAN IP that
    would break the demo on any other machine, and an un-normalized scoring formula
    in decisionEngine.js. In phase two, Bob planned the minimal frontend-backend
    integration changes, which the team reviewed and approved before implementation.
    Bob then applied the changes: Vite proxy configuration, async API wiring for all
    three user actions, backend-to-frontend field mapping, and persistent decision
    log display. In phase three, Bob evaluated the completed submission against the
    hackathon evaluation criteria and identified documentation gaps, including that
    several docs files remained as unfilled templates.

  ibm_bob_tasks:
    - "Full codebase review — 14 prioritized findings covering bugs, logic errors, security risks, and demo risks"
    - "Identified disconnected frontend: api.js functions written but never imported in App.jsx"
    - "Identified hardcoded LAN IP in api.js that would break the demo on any other machine"
    - "Identified un-normalized scoring inputs in decisionEngine.js causing inflated priority scores"
    - "Planned the minimal integration change set before any code was written"
    - "Implemented Vite proxy, async API wiring, field mapping, and decision log persistence"
    - "Reviewed completed submission against hackathon evaluation criteria"

