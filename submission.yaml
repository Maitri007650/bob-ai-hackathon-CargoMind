submission:
  title: "ShipTriage"

  problem_statement: >
    Supply chain disruptions such as weather events, port strikes, and other
    operational disruptions can affect many active shipments at the same time,
    making it difficult for logistics operations managers to quickly identify
    affected shipments, assess their priority, and choose suitable alternative
    routes.

  solution_summary: >
    ShipTriage is a logistics disruption decision-support application that helps
    operations managers analyze affected shipments, rank them by criticality,
    review rerouting options, and approve or override a recommended route while
    maintaining a decision log.

  key_features:
    - "Disruption input and affected shipment analysis"
    - "Shipment priority and criticality ranking"
    - "Shipment details with alternative rerouting options"
    - "Recommended rerouting option for manager review"
    - "Approve or override decisions with decision logging"

  tech_stack:
    languages:
      - "JavaScript"
    frameworks:
      - "React"
      - "Vite"
      - "Node.js"
      - "Express"
    ibm_technologies:
      - "IBM Bob"
    databases:
      - "SQLite"
    other:
      - "Git"
      - "GitHub"

  what_we_are_most_proud_of: >
    We are most proud of the end-to-end disruption decision workflow in ShipTriage,
    which connects the frontend with the backend to analyze disruptions, present
    shipment priorities and rerouting options, capture the manager's decision,
    and maintain a decision log.

  known_limitations: >
    The current MVP focuses on the core disruption-to-decision workflow. Advanced
    capabilities such as live external disruption feeds, real-time fleet
    optimisation, cold-chain IoT monitoring, and production deployment are not
    fully implemented in the current version.

