submission:
  title: "ShipTriage"

  problem_statement: >
    Logistics operations managers need to quickly identify shipments affected
    by supply chain disruptions and determine which shipments require the most
    urgent attention. Different shipments have different SLA urgency, customer
    importance, cargo criticality, value, and rerouting constraints.

  solution_summary: >
    ShipTriage is a supply chain disruption decision-support application that
    identifies affected shipments, ranks their priority, compares rerouting
    options, and provides a recommendation for manager approval or override.
    The system records the final decision for traceability.

  key_features:
    - "Disruption impact analysis and identification of affected shipments"
    - "Rule-based shipment priority and criticality ranking"
    - "Rerouting option comparison based on delay, cost, SLA, and feasibility"
    - "Manager approval or override of rerouting recommendations"
    - "Decision logging for traceability"

  tech_stack:
    languages: ["JavaScript"]
    frameworks: ["React", "Vite", "Node.js", "Express"]
    ibm_technologies: ["IBM Bob"]
    databases: ["SQLite"]
    other: ["GitHub Actions"]

  what_we_are_most_proud_of: >
    We are most proud of completing the end-to-end ShipTriage workflow from
    disruption input through impact analysis, shipment prioritization,
    rerouting recommendation, manager approval or override, and decision
    logging in one working application.

  known_limitations: >
    The MVP uses simulated shipment and disruption data and rule-based
    decision logic. It does not include live carrier integrations, GPS-based
    tracking, machine learning, advanced route optimization, fleet-level
    optimization, or IoT and cold-chain monitoring.

